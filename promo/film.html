<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DATO OCR 宣传片</title>
<link rel="stylesheet" href="node_modules/@fontsource/inter/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/600.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/inter/800.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/400.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/700.css">
<link rel="stylesheet" href="node_modules/@fontsource/noto-sans-sc/900.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/500.css">
<link rel="stylesheet" href="node_modules/@fontsource/jetbrains-mono/700.css">
<style>
:root {
  --mint: #2df5b0;
  --lime: #e9ff5a;
  --bg: #0b0d10;
  --ink: #f4f7f8;
  --ink2: rgba(232, 238, 242, 0.62);
  --ink3: rgba(232, 238, 242, 0.36);
  --blue: #0a84ff;
  --red: #ff453a;
  --sans: 'Inter', 'Noto Sans SC', system-ui, sans-serif;
  --mono: 'JetBrains Mono', 'Noto Sans SC', monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
body { display: grid; place-items: center; }
body.render { display: block; }

#stage {
  position: relative; width: 1920px; height: 1080px; overflow: hidden;
  background: var(--bg); color: var(--ink); font-family: var(--sans);
  transform-origin: 0 0; flex: none;
  -webkit-font-smoothing: antialiased;
}
body:not(.render) #stage { position: absolute; left: 0; top: 0; }

.layer, .scene { position: absolute; inset: 0; }
.scene { visibility: hidden; }
.abs { position: absolute; left: 0; top: 0; }
.ch { display: inline-block; white-space: pre; will-change: transform, opacity, filter; }
svg { overflow: visible; }

/* ── 背景 ── */
#bg .blob { position: absolute; border-radius: 50%; filter: blur(90px); will-change: transform, opacity; }
#grain { position: absolute; inset: -64px; opacity: 0.045; pointer-events: none; mix-blend-mode: screen; }
#vignette { position: absolute; inset: 0; background: radial-gradient(ellipse 75% 70% at 50% 48%, transparent 55%, rgba(0,0,0,.55) 100%); pointer-events: none; }
#flash { position: absolute; inset: 0; background: #fff; opacity: 0; pointer-events: none; }

/* ── 通用文字 ── */
.caption { position: absolute; left: 0; right: 0; text-align: center; font-weight: 700; font-size: 60px; letter-spacing: 0.02em; }
.hdr { position: absolute; left: 120px; top: 112px; width: 600px; }
.hdr-label { font: 700 22px/1 var(--mono); color: var(--mint); letter-spacing: 0.14em; display: flex; align-items: center; gap: 14px; }
.hdr-label i { width: 10px; height: 10px; border-radius: 50%; background: var(--mint); box-shadow: 0 0 18px var(--mint); }
.hdr-title { margin-top: 26px; font-weight: 900; font-size: 74px; line-height: 1.16; letter-spacing: -0.005em; }
.hdr-sub { margin-top: 24px; font-size: 26px; line-height: 1.7; color: var(--ink2); font-weight: 500; }
.hdr-sub b { color: var(--ink); font-weight: 700; }
.lang-en .hdr-title { font-size: 64px; letter-spacing: -0.02em; }
.lang-en .hdr-sub { font-size: 24px; }

/* ── 键帽 ── */
.keys { position: absolute; display: flex; align-items: center; gap: 16px; }
.key {
  position: relative; min-width: 100px; height: 92px; padding: 0 26px; border-radius: 20px;
  background: linear-gradient(180deg, #3b4047 0%, #2a2e34 100%);
  font: 700 38px/92px var(--sans); color: #eef2f4; text-align: center; letter-spacing: 0.01em;
}
.key::after { content: ''; position: absolute; inset: 6px 8px 14px; border-radius: 14px; background: linear-gradient(180deg, rgba(255,255,255,.07), rgba(255,255,255,0)); pointer-events: none; }
.keys .plus { font: 600 34px var(--sans); color: var(--ink3); }
.key-hint { position: absolute; font: 500 20px var(--sans); color: var(--ink3); white-space: nowrap; }
.key-hint b { font-family: var(--mono); color: var(--ink2); font-weight: 500; }

/* ── 玻璃面板 ── */
.glass {
  background: rgba(32, 36, 41, 0.66);
  backdrop-filter: blur(26px) saturate(160%);
  border: 1px solid rgba(255, 255, 255, 0.09);
  box-shadow: 0 30px 80px rgba(0,0,0,.45), inset 0 1px 0 rgba(255,255,255,.07);
}
.win {
  position: absolute; border-radius: 16px; overflow: hidden;
  background: #1d2025; border: 1px solid rgba(255,255,255,.08);
  box-shadow: 0 24px 70px rgba(0,0,0,.5);
}
.win-bar { height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 14px; background: rgba(255,255,255,.035); border-bottom: 1px solid rgba(255,255,255,.05); font: 600 15px var(--sans); color: var(--ink2); }
.win-bar .d { width: 12px; height: 12px; border-radius: 50%; background: #ff5f57; }
.win-bar .d:nth-child(2) { background: #febc2e; }
.win-bar .d:nth-child(3) { background: #28c840; margin-right: 8px; }
.ln { height: 12px; border-radius: 6px; background: rgba(255,255,255,.09); margin: 12px 0; }

/* ── 光标 ── */
#cursor { position: absolute; left: 0; top: 0; z-index: 50; pointer-events: none; will-change: transform; }
#cursor svg { position: absolute; left: 0; top: 0; filter: drop-shadow(0 2px 4px rgba(0,0,0,.5)); }

/* ── Toast ── */
.toast { position: absolute; display: flex; align-items: center; gap: 12px; padding: 14px 24px 14px 18px; border-radius: 999px; font: 600 22px var(--sans); white-space: nowrap; }
.toast .ok { width: 30px; height: 30px; border-radius: 50%; background: var(--mint); display: grid; place-items: center; }
.chip { display: inline-flex; align-items: center; gap: 10px; padding: 10px 20px; border-radius: 999px; background: rgba(255,255,255,.06); border: 1px solid rgba(255,255,255,.1); font: 600 22px var(--sans); color: var(--ink2); white-space: nowrap; }

/* ── 播放器（浏览器里预览用；渲染时不出现） ── */
#player { position: fixed; left: 50%; bottom: 18px; transform: translateX(-50%); display: flex; gap: 12px; align-items: center; padding: 10px 16px; border-radius: 999px; background: rgba(20,22,25,.82); backdrop-filter: blur(16px); color: #dde; font: 500 13px var(--sans); z-index: 100; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
#player button { all: unset; cursor: pointer; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; background: var(--mint); color: #08110d; font-weight: 800; }
#player input { width: min(52vw, 560px); accent-color: var(--mint); }
#player span { font-family: var(--mono); min-width: 92px; text-align: right; }
body.render #player { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg" class="layer"></div>
  <div id="scenes" class="layer"></div>
  <div id="fx" class="layer">
    <div id="wipe" class="layer"></div>
    <div id="flash"></div>
    <div id="vignette"></div>
    <div id="grain"></div>
    <div id="black" style="position:absolute;inset:0;background:#000;opacity:0"></div>
  </div>
  <div id="cursor"></div>
</div>
<div id="player">
  <button id="play" title="播放 / 暂停（空格）">▶</button>
  <input id="scrub" type="range" min="0" max="1000" value="0">
  <span id="clock">0:00.0</span>
</div>
<audio id="music" preload="auto"></audio>
<script src="film.js"></script>
</body>
</html>
