[package]
name = "chenocr"
version = "0.3.1"
description = "DATO OCR · 截图 · 识字 · 翻译 · 剪贴板 · AI"
authors = ["DATO OCR"]
edition = "2021"
rust-version = "1.82"

[lib]
name = "chenocr_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# macos-private-api：macOS 上透明窗口（遮罩、面板、气泡）要用，和 tauri.conf.json 的 macOSPrivateApi 成对出现
tauri = { version = "2", features = ["tray-icon", "image-png", "protocol-asset", "macos-private-api"] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-autostart = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"

tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"

image = { version = "0.25", default-features = false, features = ["png", "jpeg", "bmp"] }
# GIF 录制的编码（MIT / Apache-2.0；调色板量化用的 color_quant 是 MIT）
gif = "0.14"

# 数据库：bundled 静态链接 SQLite（含 FTS5）
rusqlite = { version = "0.32", features = ["bundled"] }

# 翻译联网。Windows 上 native-tls 走系统 SChannel，不链接 OpenSSL，体积最小（macOS 上走系统的 Secure Transport）。
# macos-system-configuration：读 macOS 的系统代理设置（Windows 的系统代理 reqwest 本来就会读）
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls", "gzip", "socks", "stream", "macos-system-configuration"] }
tokio = { version = "1", features = ["time", "sync", "net", "rt", "macros", "io-util"] }

parking_lot = "0.12"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
uuid = { version = "1", features = ["v4"] }
sha2 = "0.10"
base64 = "0.22"
url = "2"
# 多端同步（规格 09）：加密（XChaCha20-Poly1305、X25519 配对、Argon2id 同步密码）、
# 局域网主机（axum）、设备发现（mDNS）、手机网页的二维码。全是 MIT / Apache-2.0 / BSD
chacha20poly1305 = "0.10"
x25519-dalek = "2"
hkdf = "0.12"
argon2 = "0.5"
rand_core = { version = "0.6", features = ["getrandom"] }
axum = { version = "0.8", default-features = false, features = ["tokio", "http1", "json", "query"] }
mdns-sd = { version = "0.21.5", default-features = false }
if-addrs = "0.15.0"
futures-util = "0.3.34"
qrcode = { version = "0.14.1", default-features = false, features = ["svg"] }
minisign-verify = "0.3.0"
semver = "1"
# 有道翻译网页接口：请求签名 MD5、返回内容 AES-128-CBC 解密（RustCrypto，MIT / Apache-2.0）
md-5 = "0.10"
aes = "0.8"
cbc = "0.1"
# PaddleOCR 引擎包是 7z（LZMA2 + BCJ2）。纯 Rust 解压（Apache-2.0）
sevenz-rust2 = { version = "0.23", default-features = false, features = ["util"] }

[target.'cfg(windows)'.dependencies]
# 抓屏（Apache-2.0）。必须开 wgc：默认 GDI 路径在 4K 屏上要 260ms+。
xcap = { version = "0.9", features = ["wgc"] }
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_Graphics_Dwm",
  "Win32_Graphics_Gdi",
  "Win32_Security",
  "Win32_Security_Cryptography",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_DataExchange",
  "Win32_System_JobObjects",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_Power",
  "Win32_System_ProcessStatus",
  "Win32_System_Registry",
  "Win32_System_SystemInformation",
  "Win32_System_SystemServices",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Shell",
  "Win32_UI_Shell_Common",
  "Win32_UI_WindowsAndMessaging",
  "Foundation",
  "Foundation_Collections",
  "Foundation_Numerics",
  "System",
  "UI",
  "UI_Composition",
  "UI_Composition_Desktop",
  "Win32_System_WinRT",
  "Win32_System_WinRT_Composition",
  "Globalization",
  "Graphics_Imaging",
  "Media_Ocr",
  "Storage_Streams",
] }

# 毛玻璃背板用到的 Vector2（windows 0.62 把数值类型拆成了单独的包）
windows-numerics = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
# 系统框架绑定，版本跟 tao / wry 用的保持一致（都是 MIT / Apache-2.0）
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-quartz-core = "0.3"
objc2-vision = "0.3"
block2 = "0.6"
dispatch2 = "0.3"
# 钥匙串里放一把主密钥，密钥表的内容用它做 AES-256-GCM
security-framework = "3"
aes-gcm = "0.10"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

# 量性能用：和 release 一样开优化，但关掉全量 LTO，重编快得多。不用于发版。
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
strip = false
